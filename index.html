
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tilia es una aplicación web para profesionales de la salud mental para gestionar pacientes, sesiones, notas clínicas, cobros y recordatorios."
    />
    <meta name="application-name" content="Tilia" />
    <title>Tilia | Plataforma de gestión para profesionales de la salud mental</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <script>
      (function () {
        function syncOauthFallbackVisibility() {
          var fallback = document.getElementById("oauth-verification-fallback");
          if (!fallback) return;
          fallback.style.display = window.location.pathname === "/" ? "" : "none";
        }

        var originalPushState = history.pushState;
        history.pushState = function () {
          originalPushState.apply(this, arguments);
          syncOauthFallbackVisibility();
        };

        var originalReplaceState = history.replaceState;
        history.replaceState = function () {
          originalReplaceState.apply(this, arguments);
          syncOauthFallbackVisibility();
        };

        window.addEventListener("popstate", syncOauthFallbackVisibility);
        window.addEventListener("DOMContentLoaded", syncOauthFallbackVisibility);
        syncOauthFallbackVisibility();
      })();
    </script>
  </head>

  <body>
    <div
      id="oauth-verification-fallback"
      style="background: #f8fafc; color: #334155; border-bottom: 1px solid #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;"
    >
      <div style="max-width: 1200px; margin: 0 auto; padding: 6px 12px; font-size: 12px; line-height: 1.4;">
        <strong style="font-weight: 700; color: #0f172a;">Tilia</strong> is a web application for mental health professionals to manage patients, schedule sessions, write clinical notes, track payments, and send reminders.
        <a href="https://www.somostilia.com/privacy-policy" style="margin-left: 8px; color: #4f46e5; text-decoration: underline;">Privacy Policy</a>
        <a href="https://www.somostilia.com/terms-of-service" style="margin-left: 8px; color: #4f46e5; text-decoration: underline;">Terms of Service</a>
      </div>
    </div>

    <noscript>
      <div style="max-width: 860px; margin: 8px auto 24px; padding: 0 16px; font-family: Arial, sans-serif;">
        <p>
          JavaScript está deshabilitado. Puedes consultar la
          <a href="https://www.somostilia.com/privacy-policy"> Política de Privacidad</a>.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
